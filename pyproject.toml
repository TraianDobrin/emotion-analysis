[project]
name = "emoprobe"
version = "0.1.0"
description = "Emotion vectors / linear probes for open-weights LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate",
    "numpy",
    "scikit-learn",
    "tqdm",
    "anthropic",
]

[project.optional-dependencies]
quant = ["bitsandbytes"]
dev = ["pytest"]

[tool.setuptools]
packages = ["emoprobe"]
